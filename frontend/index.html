<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Container App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container {
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        p.description {
            color: #555;
            margin-bottom: 25px;
            font-size: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #1e3c72;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #16325c;
            transform: scale(1.05);
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
            color: #222;
            font-weight: bold;
            min-height: 50px;
        }

        .footer {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Multi-Container App</h1>

        <p class="description">
            Frontend running with Nginx + Backend running with Flask + Database using MySQL
        </p>

        <button onclick="loadData()">Fetch Data</button>

        <div id="result">
            Waiting for backend response...
        </div>

        <div class="footer">
            Docker Compose Project
        </div>
    </div>

    <script>
        function loadData() {
            fetch('http://localhost:5000/data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('result').innerText = data.message;
                })
                .catch(err => {
                    document.getElementById('result').innerText =
                        "❌ Error connecting to backend";
                });
        }
    </script>

</body>
</html>
